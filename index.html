<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Map AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #090d16;
  --card-bg: rgba(17, 24, 39, 0.7);
  --card-border: rgba(255, 255, 255, 0.08);
  --accent: #10b981;
  --accent-glow: rgba(16, 185, 129, 0.15);
  --text-main: #f3f4f6;
  --text-muted: #9ca3af;
  --input-bg: #030712;
}

* { box-sizing: border-box; }
body { 
  margin: 0; 
  font-family: 'Plus Jakarta Sans', sans-serif; 
  background-color: var(--bg); 
  color: var(--text-main); 
  line-height: 1.6;
  background-image: radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.08) 0%, transparent 50%);
  background-attachment: fixed;
}

.app { max-width: 780px; margin: auto; padding: 24px 16px 40px; }
h1, h2, h3, p { margin-top: 0; }

header { margin-bottom: 24px; text-align: left; }
h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.8px; color: #fff; margin-bottom: 4px; }
.sub { color: var(--text-muted); font-size: 14px; font-weight: 400; }

.card { 
  background: var(--card-bg); 
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--card-border); 
  border-radius: 20px; 
  padding: 24px; 
  margin-bottom: 20px; 
  box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
}

h2 { font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--accent); margin-bottom: 18px; }

label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin: 14px 0 6px; }
label:first-of-type { margin-top: 0; }

input, textarea, select { 
  width: 100%; 
  border: 1px solid var(--card-border); 
  border-radius: 12px; 
  padding: 14px; 
  font: inherit; 
  font-size: 14px;
  background: var(--input-bg); 
  color: #fff; 
  transition: all 0.2s ease; 
}
input:focus, textarea:focus, select:focus { 
  outline: none; 
  border-color: var(--accent); 
  box-shadow: 0 0 0 3px var(--accent-glow);
}
textarea { min-height: 100px; resize: vertical; }

button { 
  border: 0; 
  border-radius: 12px; 
  padding: 14px 20px; 
  font-weight: 700; 
  font-size: 14px; 
  cursor: pointer; 
  background: var(--accent); 
  color: #030712; 
  transition: all 0.2s ease; 
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
button:hover { opacity: 0.9; transform: translateY(-1px); }
button:active { transform: translateY(0); }
button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

button.secondary { background: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid var(--card-border); }
button.secondary:hover { background: rgba(255, 255, 255, 0.1); }
button.danger { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.2); }
button.danger:hover { background: rgba(239, 68, 68, 0.25); }

.row { display: flex; gap: 12px; }
.row > * { flex: 1; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.stat { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--card-border); border-radius: 14px; padding: 16px; text-align: center; }
.num { font-size: 26px; font-weight: 800; color: #fff; }
.small { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

.entry { border-top: 1px solid var(--card-border); padding: 20px 0; }
.entry:first-child { border-top: 0; padding-top: 0; }
.badge { display: inline-block; padding: 4px 12px; border-radius: 99px; background: var(--accent-glow); border: 1px solid rgba(16, 185, 129, 0.3); font-size: 11px; font-weight: 700; color: var(--accent); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
.meta { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
.note { color: #e5e7eb; font-size: 15px; white-space: pre-wrap; word-break: break-word; }
.ai-summary { background: rgba(16, 185, 129, 0.05); border-left: 3px solid var(--accent); color: #d1fae5; padding: 12px 14px; border-radius: 0 10px 10px 0; font-size: 13px; margin-top: 12px; }

.actions { display: flex; gap: 8px; margin-top: 14px; }
.actions button { padding: 8px 14px; font-size: 12px; }

.progress { height: 6px; background: rgba(255, 255, 255, 0.05); border-radius: 99px; overflow: hidden; margin-top: 8px; }
.bar { height: 100%; background: var(--accent); border-radius: 99px; }
.topic { margin-bottom: 14px; }
.topichead { display: flex; justify-content: space-between; font-size: 13px; font-weight: 500; }

.empty { color: var(--text-muted); text-align: center; padding: 40px 16px; font-size: 14px; }

.filter-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; scrollbar-width: none; }
.filter-bar::-webkit-scrollbar { display: none; }
.filter-btn { padding: 8px 16px; border-radius: 99px; font-size: 12px; font-weight: 600; background: rgba(255, 255, 255, 0.04); color: var(--text-muted); white-space: nowrap; border: 1px solid var(--card-border); cursor: pointer; transition: all 0.2s; }
.filter-btn.active { background: var(--accent); color: #030712; border-color: var(--accent); }

@media(max-width:520px) {
  .stats { grid-template-columns: 1fr; }
  .row { flex-direction: column; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🧠 Knowledge Map</h1>
    <p class="sub">Tulis 1 kalimat. AI memetakan & merapikan otomatis.</p>
  </header>

  <div class="card">
    <h2 id="form-title">Tambah Pembelajaran</h2>
    <input type="hidden" id="edit-id">
    
    <label>Tanggal</label>
    <input id="date" type="date">

    <label>Apa yang kamu pelajari hari ini?</label>
    <textarea id="note" placeholder='Contoh: Belajar print("Hello World") di Python atau baca Meditations tentang kontrol diri...'></textarea>
    
    <label>Tingkat Pemahaman</label>
    <select id="understanding">
      <option value="1">1/5 · Baru Tahu</option>
      <option value="2">2/5 · Sedikit Paham</option>
      <option value="3" selected>3/5 · Cukup Paham</option>
      <option value="4">4/5 · Sangat Paham</option>
      <option value="5">5/5 · Bisa Menjelaskan</option>
    </select>
    
    <div class="row" style="margin-top:20px">
      <button onclick="saveEntry()" id="submit-btn">Simpan & Proses AI</button>
      <button class="secondary" onclick="resetForm()" id="cancel-btn" style="display:none">Batal</button>
    </div>
  </div>

  <div class="card">
    <h2>Perkembangan Topik</h2>
    <div class="stats">
      <div class="stat"><div class="num" id="days">0</div><div class="small">Hari Aktif</div></div>
      <div class="stat"><div class="num" id="total">0</div><div class="small">Total Catatan</div></div>
      <div class="stat"><div class="num" id="avg">0%</div><div class="small">Rata-rata Pemahaman</div></div>
    </div>
    <div id="topics"></div>
  </div>

  <div class="card">
    <h2>Riwayat & Rangkuman</h2>
    <div id="filters" class="filter-bar"></div>
    <div id="history" class="empty">Belum ada catatan. Tulis sesuatu di atas!</div>
  </div>

  <div class="card" style="border-style: dashed; opacity: 0.8;">
    <h2>⚙️ Pengaturan AI</h2>
    <label>Gemini API Key (Tersimpan Lokal di Browser)</label>
    <input id="api-key" type="password" placeholder="Tempel Gemini API Key di sini" onchange="saveApiKey()">
    <p class="small" style="margin-top:8px;">Dapatkan API key gratis di <a href="https://aistudio.google.com/" target="_blank" style="color:var(--accent);">aistudio.google.com</a>.</p>
  </div>
</div>

<script>
const KEY = "knowledge_tracker_v1";
const API_KEY_STORAGE = "gemini_api_key_v1";

let data = JSON.parse(localStorage.getItem(KEY) || "[]");
let activeFilter = "Semua";

document.getElementById("date").value = new Date().toISOString().slice(0, 10);
document.getElementById("api-key").value = localStorage.getItem(API_KEY_STORAGE) || "";

function saveApiKey() {
  const key = document.getElementById("api-key").value.trim();
  localStorage.setItem(API_KEY_STORAGE, key);
}

function persist() {
  localStorage.setItem(KEY, JSON.stringify(data));
  render();
}

async function analyzeWithAI(text) {
  const apiKey = localStorage.getItem(API_KEY_STORAGE);
  
  if (!apiKey) {
    alert("Isi Gemini API Key kamu dulu di bagian Pengaturan AI paling bawah!");
    return {
      topic: "Umum",
      summary: "API Key belum diisi."
    };
  }

  // Model Gemini terbaru
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
  const prompt = `Analisis catatan pembelajaran ringkas berikut: "${text}".
  Berikan output DALAM FORMAT JSON SAJA dengan struktur persis:
  {
    "topic": "Topik Utama singkat 1-2 kata (misal: Coding, Filsafat, Sains, Agama, Bisnis, Ekonomi, Buku, dll)",
    "summary": "Rangkuman ringkas atau koreksi pemahaman jika ada yang keliru (1-2 kalimat)"
  }`;

  const payload = {
    contents: [{ parts: [{ text: prompt }] }]
  };

  try {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    
    const resData = await res.json();

    if (resData.error) {
      alert("Error dari Gemini API: " + resData.error.message);
      return { topic: "Error", summary: resData.error.message };
    }

    let rawText = resData.candidates[0].content.parts[0].text;
    rawText = rawText.replace(/```json/gi, "").replace(/```/g, "").trim();
    
    return JSON.parse(rawText);
  } catch (err) {
    console.error(err);
    alert("Gagal memproses AI: " + err.message);
    return {
      topic: "Lainnya",
      summary: "Terjadi kesalahan koneksi atau format data."
    };
  }
}

async function saveEntry() {
  const editId = document.getElementById("edit-id").value;
  const date = document.getElementById("date").value;
  const note = document.getElementById("note").value.trim();
  const understanding = +document.getElementById("understanding").value;
  const submitBtn = document.getElementById("submit-btn");

  if (!date || !note) {
    alert("Tanggal dan isi catatan tidak boleh kosong.");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Sedang Memproses AI...";

  const aiResult = await analyzeWithAI(note);

  if (editId) {
    const index = data.findIndex(x => x.id === +editId);
    if (index !== -1) {
      data[index] = { 
        id: +editId, 
        date, 
        topic: aiResult.topic || "Umum", 
        note, 
        summary: aiResult.summary || "",
        understanding 
      };
    }
  } else {
    data.unshift({ 
      id: Date.now(), 
      date, 
      topic: aiResult.topic || "Umum", 
      note, 
      summary: aiResult.summary || "",
      understanding 
    });
  }

  submitBtn.disabled = false;
  submitBtn.textContent = "Simpan & Proses AI";

  resetForm();
  persist();
}

function editEntry(id) {
  const item = data.find(x => x.id === id);
  if (!item) return;

  document.getElementById("edit-id").value = item.id;
  document.getElementById("date").value = item.date;
  document.getElementById("note").value = item.note;
  document.getElementById("understanding").value = item.understanding;

  document.getElementById("form-title").textContent = "Edit Pembelajaran";
  document.getElementById("submit-btn").textContent = "Perbarui & Proses AI";
  document.getElementById("cancel-btn").style.display = "inline-flex";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function resetForm() {
  document.getElementById("edit-id").value = "";
  document.getElementById("note").value = "";
  document.getElementById("date").value = new Date().toISOString().slice(0, 10);
  document.getElementById("understanding").value = 3;

  document.getElementById("form-title").textContent = "Tambah Pembelajaran";
  document.getElementById("submit-btn").textContent = "Simpan & Proses AI";
  document.getElementById("cancel-btn").style.display = "none";
}

function del(id) {
  if (confirm("Yakin ingin menghapus catatan ini?")) {
    data = data.filter(x => x.id !== id);
    persist();
  }
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
  }[c]));
}

function label(n) {
  return ["", "Baru Tahu", "Sedikit Paham", "Cukup Paham", "Sangat Paham", "Bisa Menjelaskan"][n] || "";
}

function setFilter(cat) {
  activeFilter = cat;
  render();
}

function render() {
  const days = new Set(data.map(x => x.date)).size;
  const avg = data.length ? Math.round(data.reduce((a, x) => a + x.understanding, 0) / data.length / 5 * 100) : 0;
  
  document.getElementById("days").textContent = days;
  document.getElementById("total").textContent = data.length;
  document.getElementById("avg").textContent = avg + "%";

  const groups = {};
  data.forEach(x => {
    if (!groups[x.topic]) groups[x.topic] = [];
    groups[x.topic].push(x);
  });

  const topicsContainer = document.getElementById("topics");
  topicsContainer.innerHTML = Object.keys(groups).length ? 
    "<h3 style='margin:24px 0 12px; font-size:14px; color:var(--text-muted); text-transform:uppercase;'>Bidang yang Berkembang</h3>" +
    Object.entries(groups).sort((a, b) => b[1].length - a[1].length).map(([k, v]) => {
      const a = Math.round(v.reduce((s, x) => s + x.understanding, 0) / v.length / 5 * 100);
      return `<div class="topic">
        <div class="topichead"><b>${esc(k)}</b><span style="color:var(--text-muted);">${v.length} catatan · ${a}%</span></div>
        <div class="progress"><div class="bar" style="width:${a}%"></div></div>
      </div>`;
    }).join("") : "";

  // Render Filter
  const filtersContainer = document.getElementById("filters");
  const categories = ["Semua", ...Object.keys(groups)];
  if (data.length && categories.length > 2) {
    filtersContainer.style.display = "flex";
    filtersContainer.innerHTML = categories.map(cat => 
      `<button class="filter-btn ${activeFilter === cat ? 'active' : ''}" onclick="setFilter('${esc(cat)}')">${esc(cat)}</button>`
    ).join("");
  } else {
    filtersContainer.style.display = "none";
  }

  // Render History
  const historyContainer = document.getElementById("history");
  const filteredData = activeFilter === "Semua" ? data : data.filter(x => x.topic === activeFilter);

  if (!data.length) {
    historyContainer.className = "empty";
    historyContainer.textContent = "Belum ada catatan. Tulis sesuatu di atas!";
    return;
  }

  if (!filteredData.length) {
    historyContainer.className = "empty";
    historyContainer.textContent = "Tidak ada catatan untuk topik ini.";
    return;
  }

  historyContainer.className = "";
  historyContainer.innerHTML = filteredData.map(x => `
    <div class="entry">
      <div class="meta">${esc(x.date)}</div>
      <span class="badge">${esc(x.topic)}</span>
      <div class="note">${esc(x.note)}</div>
      ${x.summary ? `<div class="ai-summary">🤖 <b>AI Insight:</b> ${esc(x.summary)}</div>` : ''}
      <div class="small" style="margin-top:10px;">Pemahaman: ${x.understanding}/5 · ${label(x.understanding)}</div>
      <div class="actions">
        <button class="secondary" onclick="editEntry(${x.id})">Edit</button>
        <button class="danger" onclick="del(${x.id})">Hapus</button>
      </div>
    </div>`).join("");
}

render();
</script>
</body>
</html>
