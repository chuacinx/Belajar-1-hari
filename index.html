<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Knowledge Map AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: rgba(16, 22, 36, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent: #10b981;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 24px; }
        header h1 { font-size: 1.5rem; color: var(--accent); }
        
        /* Grid Layout */
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
        .card { background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(12px); border-radius: 12px; padding: 20px; }
        
        /* Knowledge Map Section */
        .map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 12px; }
        .map-card { background: rgba(255,255,255,0.03); border: 1px solid var(--card-border); border-radius: 8px; padding: 12px; }
        .map-card h4 { color: var(--accent); font-size: 0.95rem; margin-bottom: 6px; }
        .map-card p { font-size: 0.8rem; color: var(--text-muted); }

        /* Form & Inputs */
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        label { font-size: 0.85rem; color: var(--text-muted); }
        input, textarea { background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); border-radius: 8px; padding: 10px; color: #fff; outline: none; }
        input:focus, textarea:focus { border-color: var(--accent); }
        button { background: var(--accent); color: #000; font-weight: 700; border: none; border-radius: 8px; padding: 12px; cursor: pointer; width: 100%; }
        
        /* Timeline Feed */
        .log-item { border-left: 3px solid var(--accent); background: rgba(255,255,255,0.02); padding: 12px; margin-bottom: 12px; border-radius: 0 8px 8px 0; }
        .badge { background: rgba(16, 185, 129, 0.2); color: var(--accent); padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .concept-tag { background: rgba(255,255,255,0.1); color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; margin-right: 4px; }
        
        #toast { position: fixed; bottom: 20px; right: 20px; background: var(--accent); color: #000; padding: 10px 18px; border-radius: 8px; font-weight: 600; opacity: 0; transition: opacity 0.3s; }
        #toast.show { opacity: 1; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🧠 Personal Knowledge Map AI</h1>
    </header>

    <div class="card">
        <div class="form-group" style="margin:0;">
            <label for="api-key">Gemini API Key (Tersimpan di local browser):</label>
            <input type="password" id="api-key" placeholder="Masukkan Gemini API Key..." onchange="saveKey()">
        </div>
    </div>

    <div class="card">
        <h3 style="margin-bottom: 12px;">Input Pembelajaran Hari Ini</h3>
        <form id="knowledge-form">
            <div class="form-group">
                <textarea id="raw-note" rows="2" placeholder="Contoh: Baca Meditations tentang membedakan hal yang bisa dan tidak bisa dikendalikan." required></textarea>
            </div>
            <button type="submit" id="btn-submit">Proses & Petakan Pengetahuan</button>
        </form>
    </div>

    <div class="card">
        <h3>🗺️ KNOWLEDGE MAP PRIBADI</h3>
        <div class="map-grid" id="knowledge-map">
            </div>
    </div>

    <div class="card">
        <h3>📚 Jurnal Catatan & Insight</h3>
        <div id="logs-container" style="margin-top: 12px;"></div>
    </div>
</div>

<div id="toast">Notifikasi</div>

<script>
    let db = JSON.parse(localStorage.getItem('my_knowledge_db')) || [];
    const apiKeyInput = document.getElementById('api-key');
    
    apiKeyInput.value = localStorage.getItem('km_gemini_key') || '';
    function saveKey() {
        localStorage.setItem('km_gemini_key', apiKeyInput.value.trim());
        showToast('API Key tersimpan!');
    }

    document.getElementById('knowledge-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const noteText = document.getElementById('raw-note').value.trim();
        const apiKey = apiKeyInput.value.trim();

        if(!apiKey) return alert('Masukkan Gemini API Key dulu!');

        const btn = document.getElementById('btn-submit');
        btn.disabled = true;
        btn.textContent = 'Menganalisis & Mengkategorikan...';

        try {
            const aiResult = await processWithGemini(noteText, apiKey);
            
            const newEntry = {
                id: Date.now(),
                date: new Date().toLocaleDateString('id-ID'),
                raw: noteText,
                category: aiResult.category,
                concepts: aiResult.concepts,
                summary: aiResult.summary
            };

            db.unshift(newEntry);
            localStorage.setItem('my_knowledge_db', JSON.stringify(db));
            
            document.getElementById('raw-note').value = '';
            showToast('Pengetahuan baru berhasil dipetakan!');
            renderAll();
        } catch (err) {
            alert('Gagal memproses AI: ' + err.message);
        } finally {
            btn.disabled = false;
            btn.textContent = 'Proses & Petakan Pengetahuan';
        }
    });

    async function processWithGemini(text, key) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`;
        
        // Ambil daftar kategori yang sudah ada untuk konteks
        const existingCategories = Array.from(new Set(db.map(d => d.category))).join(', ');

        const prompt = `Lu adalah sistem Knowledge Graph pribadi. Analisis input catatan harian ini: "${text}".
        Kategori saat ini yang sudah ada: [${existingCategories}].
        Aturan:
        1. Identifikasi Kategori utama (Boleh pakai yang sudah ada, atau buat kategori baru jika bidangnya beda).
        2. Ekstrak 1-3 Konsep Utama (misal: Dikotomi Kendali, Amor Fati).
        3. Buatkan rangkuman/koreksi pemahaman singkat (1 kalimat).
        
        Kembalikan HANYA JSON murni:
        {
            "category": "Nama Kategori",
            "concepts": ["Konsep1", "Konsep2"],
            "summary": "Rangkuman singkat"
        }`;

        const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { responseMimeType: "application/json" }
            })
        });

        if(!res.ok) throw new Error('API Error');
        const data = await res.json();
        return JSON.parse(data.candidates[0].content.parts[0].text);
    }

    function renderAll() {
        renderMap();
        renderLogs();
    }

    function renderMap() {
        const mapContainer = document.getElementById('knowledge-map');
        if(db.length === 0) {
            mapContainer.innerHTML = '<p style="color:var(--text-muted); font-size:0.85rem;">Belum ada pengetahuan yang dipetakan.</p>';
            return;
        }

        // Grouping berdasarkan Kategori
        const categories = {};
        db.forEach(item => {
            if(!categories[item.category]) categories[item.category] = [];
            categories[item.category].push(...item.concepts);
        });

        mapContainer.innerHTML = Object.entries(categories).map(([cat, concepts]) => {
            const uniqueConcepts = Array.from(new Set(concepts)).join(', ');
            const count = db.filter(d => d.category === cat).length;
            return `
                <div class="map-card">
                    <h4>${escapeHtml(cat)}</h4>
                    <p><strong>${count} Materi</strong> dipelajari</p>
                    <p style="margin-top:4px; font-size:0.75rem;">Konsep: ${escapeHtml(uniqueConcepts)}</p>
                </div>
            `;
        }).join('');
    }

    function renderLogs() {
        const logsContainer = document.getElementById('logs-container');
        if(db.length === 0) {
            logsContainer.innerHTML = '<p style="color:var(--text-muted); font-size:0.85rem;">Belum ada riwayat.</p>';
            return;
        }

        logsContainer.innerHTML = db.map(item => `
            <div class="log-item">
                <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                    <span class="badge">${escapeHtml(item.category)}</span>
                    <span style="font-size:0.75rem; color:var(--text-muted);">${item.date}</span>
                </div>
                <p style="font-size:0.9rem; margin-bottom:6px;">"${escapeHtml(item.raw)}"</p>
                <div style="margin-bottom:6px;">
                    ${item.concepts.map(c => `<span class="concept-tag">${escapeHtml(c)}</span>`).join('')}
                </div>
                <p style="font-size:0.8rem; color:var(--text-muted); border-top: 1px solid rgba(255,255,255,0.05); padding-top:4px;">
                    💡 <em>${escapeHtml(item.summary)}</em>
                </p>
            </div>
        `).join('');
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function escapeHtml(str) {
        return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    renderAll();
</script>
</body>
</html>
